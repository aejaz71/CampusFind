{% extends "base.html" %}{% block title %}Register{% endblock %}{% block content %}
<div class="form-card"><h2>Create account</h2><form method="post">
<label class="form-label">Full name</label><input class="form-control mb-3" name="name" required>
<label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
<label class="form-label">Password (minimum 6 characters)</label><input class="form-control mb-3" type="password" name="password" minlength="6" required>
<button class="btn btn-primary w-100">Register</button></form></div>{% endblock %}
